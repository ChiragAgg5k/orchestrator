# Helm value overrides for local development (applied on top of charts/orchestrator/values.yaml).
# Used by the Tiltfile when running against the kind-orchestrator-dev cluster.
jobs:
  enabled: true
  image:
    repository: ko.local/jobs-service
    tag: latest
    pullPolicy: Never
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
  # A local cluster: the planes serve without a key.
  auth:
    allowUnauthenticated: true

deployments:
  auth:
    allowUnauthenticated: true

sandbox:
  auth:
    allowUnauthenticated: true

images:
  jobSidecar:
    repository: ko.local/job-sidecar
    tag: latest
  # Kind loaded the ko.local images; tell kubelet to use them instead of
  # pulling. User images (alpine, python, etc.) still pull normally.
  pullPolicy: Never
